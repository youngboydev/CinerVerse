<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nick AI 🤖</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #050816;
      --panel: rgba(15, 23, 42, 0.78);
      --panel2: rgba(30, 41, 59, 0.65);
      --border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #3b82f6;
      --purple: #8b5cf6;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(59,130,246,.18), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(139,92,246,.18), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    /* Animated background */

    .orb {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .25;
      pointer-events: none;
      animation: float 8s infinite alternate ease-in-out;
    }

    .orb.one {
      background: #2563eb;
      top: -120px;
      left: -100px;
    }

    .orb.two {
      background: #7c3aed;
      bottom: -150px;
      right: -100px;
      animation-delay: 2s;
    }

    @keyframes float {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translate(50px, 40px);
      }
    }

    /* Main app */

    .app {
      width: 95%;
      max-width: 1200px;
      height: 92vh;
      margin: 4vh auto;
      display: flex;
      background: rgba(8, 15, 30, .72);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      backdrop-filter: blur(25px);
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }

    /* Sidebar */

    .sidebar {
      width: 250px;
      padding: 25px 18px;
      background: rgba(2,6,23,.55);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 35px;
    }

    .logo-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 23px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      box-shadow: 0 8px 25px rgba(59,130,246,.3);
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 800;
    }

    .logo span {
      color: #60a5fa;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(96,165,250,.25);
      border-radius: 13px;
      background: rgba(59,130,246,.1);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: .25s;
    }

    .new-chat:hover {
      background: rgba(59,130,246,.2);
      transform: translateY(-2px);
    }

    .menu-title {
      color: #64748b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 30px 10px 12px;
    }

    .menu-item {
      padding: 12px;
      border-radius: 10px;
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: .2s;
    }

    .menu-item:hover,
    .menu-item.active {
      background: rgba(255,255,255,.06);
      color: white;
    }

    .status {
      margin-top: auto;
      padding: 13px;
      border-radius: 13px;
      background: rgba(34,197,94,.07);
      border: 1px solid rgba(34,197,94,.12);
      font-size: 12px;
      color: #86efac;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 7px;
      box-shadow: 0 0 10px #22c55e;
    }

    /* Chat */

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 75px;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(15,23,42,.3);
    }

    .ai-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ai-avatar {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      font-size: 21px;
    }

    .ai-info h2 {
      font-size: 15px;
    }

    .ai-info p {
      color: #64748b;
      font-size: 11px;
      margin-top: 3px;
    }

    .online {
      color: #4ade80;
    }

    .clear-btn {
      border: 0;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font-size: 13px;
      transition: .2s;
    }

    .clear-btn:hover {
      color: white;
    }

    /* Messages */

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 35px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 5px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 20px;
    }

    .welcome {
      text-align: center;
      max-width: 600px;
      margin: 8vh auto 40px;
    }

    .welcome-icon {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 38px;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      box-shadow: 0 15px 40px rgba(59,130,246,.25);
    }

    .welcome h2 {
      margin-top: 22px;
      font-size: 30px;
      font-weight: 800;
    }

    .welcome h2 span {
      background: linear-gradient(90deg,#60a5fa,#a78bfa);
      -webkit-background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: #94a3b8;
      margin-top: 10px;
      line-height: 1.6;
      font-size: 14px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
    }

    .suggestion {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: #cbd5e1;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .suggestion:hover {
      border-color: rgba(96,165,250,.4);
      background: rgba(59,130,246,.1);
    }

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      animation: appear .3s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 35px;
      height: 35px;
      flex-shrink: 0;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 16px;
      background: #1e293b;
    }

    .message.user .avatar {
      background: linear-gradient(135deg,#2563eb,#4f46e5);
    }

    .bubble {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 17px;
      background: rgba(30,41,59,.8);
      border: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: linear-gradient(135deg,#2563eb,#4f46e5);
      border: none;
      border-bottom-right-radius: 5px;
    }

    .message.ai .bubble {
      border-bottom-left-radius: 5px;
    }

    /* Input */

    .input-wrapper {
      padding: 18px 25px 22px;
      border-top: 1px solid var(--border);
      background: rgba(2,6,23,.4);
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 17px;
      background: rgba(15,23,42,.85);
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      transition: .2s;
    }

    .input-box:focus-within {
      border-color: rgba(96,165,250,.5);
      box-shadow: 0 0 0 3px rgba(59,130,246,.08);
    }

    #input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 13px;
      font-size: 14px;
      font-family: inherit;
    }

    #input::placeholder {
      color: #64748b;
    }

    #send {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 13px;
      color: white;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      cursor: pointer;
      font-size: 18px;
      transition: .2s;
    }

    #send:hover {
      transform: scale(1.05);
    }

    #send:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .footer-text {
      text-align: center;
      color: #475569;
      font-size: 10px;
      margin-top: 9px;
    }

    /* Mobile */

    @media (max-width: 700px) {

      body {
        overflow: auto;
      }

      .app {
        width: 100%;
        height: 100vh;
        margin: 0;
        border-radius: 0;
        border: none;
      }

      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 17px;
      }

      #messages {
        padding: 22px 16px;
      }

      .welcome {
        margin-top: 7vh;
      }

      .welcome h2 {
        font-size: 25px;
      }

      .bubble {
        max-width: 82%;
        font-size: 13px;
      }

      .input-wrapper {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="orb one"></div>
  <div class="orb two"></div>

  <div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="logo">
        <div class="logo-icon">🤖</div>

        <h1>Nick <span>AI</span></h1>
      </div>

      <button class="new-chat" onclick="newChat()">
        ＋ New Chat
      </button>

      <div class="menu-title">Workspace</div>

      <div class="menu-item active">
        💬 Chat
      </div>

      <div class="menu-item">
        ✨ Explore
      </div>

      <div class="menu-item">
        ⚙️ Settings
      </div>

      <div class="status">
        <span class="dot"></span>
        Nick AI is online
      </div>

    </aside>

    <!-- CHAT -->

    <main class="chat">

      <header class="topbar">

        <div class="ai-info">

          <div class="ai-avatar">
            🤖
          </div>

          <div>
            <h2>Nick AI</h2>
            <p>
              <span class="online">● Online</span>
              · AI Assistant
            </p>
          </div>

        </div>

        <button class="clear-btn" onclick="clearChat()">
          Clear chat
        </button>

      </header>

      <!-- MESSAGES -->

      <section id="messages">

        <div class="welcome" id="welcome">

          <div class="welcome-icon">
            🤖
          </div>

          <h2>
            Welcome to <span>Nick AI</span>
          </h2>

          <p>
            Your smart AI assistant. Ask questions, learn new things,
            brainstorm ideas, write code and much more.
          </p>

          <div class="suggestions">

            <button class="suggestion"
              onclick="useSuggestion('Explain JavaScript to me')">
              💻 Explain JavaScript
            </button>

            <button class="suggestion"
              onclick="useSuggestion('Give me a cool website idea')">
              💡 Website idea
            </button>

            <button class="suggestion"
              onclick="useSuggestion('Help me learn programming')">
              🚀 Learn programming
            </button>

          </div>

        </div>

      </section>

      <!-- INPUT -->

      <div class="input-wrapper">

        <div class="input-box">

          <input
            id="input"
            type="text"
            autocomplete="off"
            placeholder="Message Nick AI..."
          >

          <button id="send" onclick="sendMessage()">
            ➤
          </button>

        </div>

        <div class="footer-text">
          Nick AI can make mistakes. Check important information.
        </div>

      </div>

    </main>

  </div>

  <script>

    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("send");

    function removeWelcome() {
      const welcome = document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }
    }

    function addMessage(text, type) {

      removeWelcome();

      const message = document.createElement("div");
      message.className = `message ${type}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = type === "user" ? "👤" : "🤖";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(avatar);
      message.appendChild(bubble);

      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;

      return bubble;
    }

    async function sendMessage() {

      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");

      input.value = "";

      sendButton.disabled = true;

      const aiBubble = addMessage(
        "Nick AI is thinking... 🤔",
        "ai"
      );

      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })

        });

        const data = await response.json();

        if (data.reply) {

          aiBubble.textContent = data.reply;

        } else {

          aiBubble.textContent =
            "❌ " + (data.error || "Something went wrong.");

        }

      } catch (error) {

        console.error(error);

        aiBubble.textContent =
          "❌ I couldn't connect to the server.";

      }

      sendButton.disabled = false;

      input.focus();

      messages.scrollTop = messages.scrollHeight;
    }

    function useSuggestion(text) {

      input.value = text;
      input.focus();

    }

    function clearChat() {

      messages.innerHTML = `
        <div class="welcome" id="welcome">

          <div class="welcome-icon">
            🤖
          </div>

          <h2>
            Welcome to <span>Nick AI</span>
          </h2>

          <p>
            Your smart AI assistant. Ask questions, learn new things,
            brainstorm ideas, write code and much more.
          </p>

          <div class="suggestions">

            <button class="suggestion"
              onclick="useSuggestion('Explain JavaScript to me')">
              💻 Explain JavaScript
            </button>

            <button class="suggestion"
              onclick="useSuggestion('Give me a cool website idea')">
              💡 Website idea
            </button>

            <button class="suggestion"
              onclick="useSuggestion('Help me learn programming')">
              🚀 Learn programming
            </button>

          </div>

        </div>
      `;

    }

    function newChat() {
      clearChat();
      input.focus();
    }

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

  </script>

</body>
</html>
